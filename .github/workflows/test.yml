name: artist-cover-tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "brand-kit/cover-system.json"
      - "brand-kit/badges/**"
      - "brand-kit/prompts/**"
      - "logo-ahangban/ahangban-logo-horizontal-reverse.svg"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "brand-kit/cover-system.json"
      - "brand-kit/badges/**"
      - "brand-kit/prompts/**"
      - "logo-ahangban/ahangban-logo-horizontal-reverse.svg"
      - "pyproject.toml"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
