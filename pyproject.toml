[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahangban-artist-cover"
version = "1.0.0"
description = "Repeatable, verification-safe artist cover asset pipeline for Ahangban"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.4,<13",
  "resvg-py>=0.5,<0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ahangban-artist = "ahangban_artists.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
